<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Allergy Safety & Advocacy | @livlovesfoodect</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 850px; margin: 0 auto; padding: 20px; background-color: #fffaf0; }
        header { background: #c62828; color: white; padding: 40px 20px; text-align: center; border-radius: 15px; margin-bottom: 25px; }
        .section { background: white; padding: 30px; margin-bottom: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #c62828; border-bottom: 3px solid #ffcdd2; padding-bottom: 10px; margin-top: 0; }
        
        /* Blog Gallery */
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin: 20px 0; }
        .gallery-item { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; border: 1px solid #eee; }
        
        /* Reaction Guide Styling */
        .reaction-box { background: #fff5f5; border-left: 5px solid #c62828; padding: 20px; border-radius: 8px; }
        .symptom-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .symptom-item { background: white; padding: 10px; border-radius: 5px; border: 1px solid #ffcdd2; font-weight: bold; }

        /* Contest Section */
        .award-badge { background: #fff9c4; border: 2px dashed #fbc02d; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 20px; font-size: 1.2rem; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: #000; }
        .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .btn { display: inline-block; background: #c62828; color: white; padding: 15px 30px; text-decoration: none; border-radius: 30px; font-weight: bold; transition: 0.3s; margin-top: 15px; }
        .btn:hover { background: #a50000; transform: translateY(-2px); }
    </style>
</head>

<header>

</header>
